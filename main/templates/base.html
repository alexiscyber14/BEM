{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Broken Elevator Media</title>
      <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&family=Bebas+Neue&display=swap" rel="stylesheet">
  <link rel="stylesheet" >
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/base.css' %}">  
<link rel="stylesheet" href="{% static 'css/vid-detail.css' %}">
  {% block extra_css %}{% endblock %}
</head>
<body>
  <header class="header" id="header">
    <div class="container">
      <div class="logo"><a href="/">B:E <span>MEDIA</span></a></div>
      <nav class="nav">
        <ul class="nav-links">
<li class="{% if request.resolver_match.url_name == 'home' %}activev{% endif %}">
    <a href="/">Home</a>
</li>

<li class="{% if request.resolver_match.url_name == 'about' %}activev{% endif %}">
    <a href="{% url 'about' %}">About</a>
</li>

<li class="{% if request.resolver_match.url_name == 'services' %}activev{% endif %}">
    <a href="{% url 'services' %}">Services</a>
</li>

<li class="{% if request.resolver_match.url_name == 'portfolio' %}activev{% endif %}">
    <a href="{% url 'portfolio' %}">Portfolio</a>
</li>

<li class="{% if request.resolver_match.url_name == 'hall' %}activev{% endif %}">
    <a href="{% url 'hall' %}">Hall of Frames</a>
</li>

<li class="{% if request.resolver_match.url_name == 'events' %}activev{% endif %}">
    <a href="{% url 'events' %}">Events</a>
</li>

<li class="{% if request.resolver_match.url_name == 'blog' %}activev{% endif %}">
    <a href="{% url 'blog' %}">Blog</a>
</li>

<li class="{% if request.resolver_match.url_name == 'contact' %}activev{% endif %}">
    <a href="{% url 'contact' %}">Contact</a>
</li>
        </ul>
        <a href="{% url 'booking' %}" class="cta-button">Book Production</a>
      </nav>
      <div class="hamburger">
        <span></span>
        <span></span>
        <span></span>
      </div>
    </div>
  </header>
<main class="main-content">
  {% block content %}
  {% endblock content %}
</main>
{% include 'footer.html' %}
<script src="https://www.youtube.com/iframe_api"></script>
</body>
</html>
